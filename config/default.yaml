# Если из консоли: --set раздел.ключ=значение
# split_seed между прогонами не трогаем, от него зависят выборки и порядок кандидатов

experiment: debug
out_dir: runs

data:
  path: data/full_val.jsonl      # для отладки data/proxy_val.jsonl
  k: 5                           # кандидатов в промпте, ответ 0..k
  eval_size: 2000                # отложенная выборка
  dev_size: 500                  # для кривых и подбора lr / kl_coef
  split_seed: 42

model:
  name: Qwen/Qwen3-4B-Instruct-2507   # для отладки Qwen/Qwen3-0.6B
  lora_rank: 16
  lora_scale: 20.0
  lora_layers: -1                # -1 = все блоки
  batch_size: 16                 # батч инференса
  cache_limit_gb: 8.0            # без лимита MLX раздувает кэш до 100+ ГБ

reward:
  name: binary                   # binary | hierarchical | abstain
  partial_credit: 0.5            # hierarchical: столько получает сосед по ветке
  wrong_penalty: 1.0             # abstain: штраф λ за ошибку

train:
  method: grpo                   # grpo | sft
  steps: 250
  batch_size: 8                  # промптов на шаг
  group_size: 8                  # ответов на промпт
  learning_rate: 3.0e-7
  kl_coef: 0.05
  temperature: 1.0
  eval_every: 50
  seed: 0
