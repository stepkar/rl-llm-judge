[project]
name = "rl-llm-judge"
version = "0.1.0"
description = "LLM-судья поверх кандидатов каскада: GRPO-дообучение и влияние устройства награды (задание по RL, трек 3)"
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
    "mlx>=0.29",
    "mlx-lm>=0.28",
    "numpy>=1.26",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.6", "mypy>=1.11", "types-PyYAML>=6.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rl_judge"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# Проект русскоязычный: кириллица в строках/комментариях разрешена.
ignore = ["RUF001", "RUF002", "RUF003", "E501"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

# У mlx / mlx-lm / matplotlib типизация неполная — их внутренности не проверяем.
[[tool.mypy.overrides]]
module = ["mlx.*", "mlx_lm.*", "matplotlib.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
